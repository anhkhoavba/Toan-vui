<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán Vui – Mini game theo chuyên đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#F4F8FC; --grid:#DCE7F2; --grid2:#C6D6E8; --ink:#13294B; --muted:#5A6B84; --line:#C9D6E5; --card:#FFFFFF;
  --c0:#E4572E; --c1:#1F9E89; --c2:#E39B0F; --c3:#5B4BC4; --ok:#1F9E89; --bad:#D9442A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.logo svg{width:44px;height:44px}
.spacer{flex:1}
.btn{border:2px solid var(--ink);background:var(--card);padding:9px 16px;border-radius:10px;font-weight:600;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#fff}
.btn.big{font-size:1.15rem;padding:14px 26px;border-radius:14px}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.small{padding:5px 10px;font-size:.85rem;border-width:1.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px}
.setup{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:5px;font-size:.95rem}
.field .hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}
textarea{min-height:150px;resize:vertical;font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>select{flex:1}
details.help{font-size:.88rem;color:var(--muted);margin-top:8px}
details.help pre{white-space:pre-wrap;background:var(--paper);padding:10px;border-radius:8px;color:var(--ink)}
.qlist-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.qlist-head h2{margin:0;font-size:1.3rem}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.qcard.warn{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.qtext{flex:1;font-weight:500}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 8px 40px}
@media (max-width:560px){.qopts{grid-template-columns:1fr;margin-left:0}}
.qopt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.92rem}
.qopt.right{border-color:var(--ok);background:#E6F5F2;font-weight:600}
.qopt b{margin-right:6px}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:40px;font-size:.88rem;color:var(--muted)}
.qmeta input[type=number]{width:70px;padding:4px 8px}
.qmeta input[type=checkbox]{width:18px;height:18px}
.qimg{max-height:120px;border-radius:8px;border:1px solid var(--line);margin:8px 0 0 40px;display:block}
.warn-text{color:var(--bad);font-weight:600;font-size:.88rem;margin-left:40px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted);background:rgba(255,255,255,.7)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:50;max-width:90vw;text-align:center}
/* lobby */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.qrbox{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:20px;text-align:center}
.qrbox #qr{display:inline-block;padding:8px;background:#fff}
.qrbox #qr img,.qrbox #qr canvas{display:block;width:min(300px,70vw)!important;height:auto!important}
.code{font-size:clamp(2.6rem,6vw,4.4rem);font-weight:800;letter-spacing:.12em;line-height:1;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.url{font-size:.82rem;color:var(--muted);word-break:break-all}
.lobby-title{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px}
.curve{width:100%;height:70px;display:block;margin:2px 0 8px}
.curve path.f{fill:none;stroke:var(--c3);stroke-width:4;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;animation:pop .3s ease-out}
.chip .av{font-size:1.3rem}
.chip.off{opacity:.45}
.chip button{border:0;background:none;padding:0 0 0 4px;color:var(--muted);font-size:1rem}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* question (host) */
.qbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.timer{position:relative;width:96px;height:96px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .bg{stroke:var(--grid2)}
.timer .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .3s}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.timer.hurry .fg{stroke:var(--bad)}
.stage{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:clamp(18px,3vw,34px);margin-bottom:18px}
.stage .qt{font-size:clamp(1.3rem,2.6vw,2.1rem);font-weight:600;line-height:1.35}
.stage img{max-height:38vh;border-radius:12px;margin-top:14px;display:block}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{position:relative;display:flex;align-items:center;gap:14px;border:0;border-radius:16px;color:#fff;padding:18px 20px;font-size:clamp(1.05rem,2vw,1.5rem);font-weight:600;text-align:left;min-height:84px;overflow:hidden}
.ans .g{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.7rem;font-weight:800}
.ans .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width .6s ease-out}
.ans .cnt{margin-left:auto;font-weight:800;position:relative}
.ans>span{position:relative}
.ans.dim{opacity:.32}
.ans.correct{outline:5px solid var(--ink);outline-offset:3px}
.a0{background:var(--c0)}.a1{background:var(--c1)}.a2{background:var(--c2)}.a3{background:var(--c3)}
.ans .katex{color:#fff}
.controls{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
/* board */
.board{max-width:760px;margin:0 auto}
.board h2{font-size:clamp(1.6rem,3vw,2.4rem);margin:0 0 16px;text-align:center}
.rank{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 18px;margin-bottom:10px;font-size:1.2rem;font-weight:600}
.rank .pos{width:34px;font-weight:800;font-variant-numeric:tabular-nums}
.rank .av{font-size:1.6rem}
.rank .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{font-weight:800;font-variant-numeric:tabular-nums}
.rank .gain{color:var(--ok);font-size:.95rem;font-weight:700;min-width:60px;text-align:right}
/* final */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:10px 0 26px}
.pod{text-align:center;width:min(200px,30vw)}
.pod .av{font-size:clamp(2.4rem,5vw,3.6rem)}
.pod .nm{font-weight:800;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .block{border:2px solid var(--ink);border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:2.2rem;font-weight:800;color:#fff;margin-top:8px}
.pod.p1 .block{height:170px;background:var(--c2)}
.pod.p2 .block{height:120px;background:var(--c1)}
.pod.p3 .block{height:90px;background:var(--c0)}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
@media (max-width:640px){.awards{grid-template-columns:1fr}}
.award{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.award .ic{font-size:2.4rem}
.award h3{margin:0;font-size:.95rem;color:var(--muted);font-weight:600}
.award p{margin:2px 0 0;font-size:1.3rem;font-weight:800}
.award small{display:block;color:var(--muted);font-weight:500;font-size:.9rem}
.tablewrap{overflow-x:auto;background:#fff;border:2px solid var(--ink);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--paper);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
/* student */
.sbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:2px solid var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.sbar .av{font-size:1.6rem}
.sbar .nm{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .sc{font-weight:800;font-variant-numeric:tabular-nums}
.smain{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.center{text-align:center}
.bigmsg{font-size:1.6rem;font-weight:800;margin:10px 0 6px;line-height:1.25}
.bigicon{font-size:4.5rem;line-height:1;margin-top:30px}
.sq{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:14px;font-size:1.1rem;font-weight:500}
.sq img{max-height:30vh;border-radius:10px;margin-top:10px;display:block}
.sans{display:grid;gap:10px}
.sans .ans{min-height:64px;font-size:1.1rem;padding:12px 14px}
.stimer{height:10px;background:var(--grid2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.stimer i{display:block;height:100%;background:var(--ink);width:100%;transition:width .25s linear}
.result{border-radius:20px;padding:26px 18px;color:#fff;text-align:center;margin-top:20px}
.result.ok{background:var(--ok)}.result.no{background:var(--bad)}.result.none{background:var(--muted)}
.result .bigicon{margin-top:0}
.joinbox{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:22px;margin-top:24px}
.avpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.avpick button{font-size:1.6rem;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.avpick button[aria-pressed=true]{border:3px solid var(--ink);background:var(--paper)}
.muted{color:var(--muted)}
dialog.gd{max-width:min(900px,96vw)}
.gd .sec{grid-column:1/-1;border-top:1.5px solid var(--line);padding-top:10px}
.gd .sec h4{margin:0 0 8px;font-size:.98rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gd .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:6px 12px}
.gd .gq{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:8px;border:2px solid transparent}
.gd .gq .n{min-width:28px;font-weight:700;font-variant-numeric:tabular-nums}
.gd .gq button{width:34px;height:32px;border:1.5px solid var(--line);border-radius:7px;background:#fff;font-weight:700;padding:0}
.gd .gq button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gd .gq button.key{box-shadow:0 0 0 3px var(--ok) inset}
.gd .gq.ok{border-color:var(--ok);background:#E6F5F2}.gd .gq.no{border-color:var(--bad);background:#FDECE8}.gd .gq.part{border-color:var(--c2);background:#FFF4DC}
.gd .tfq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;border:2px solid transparent;margin-bottom:4px}
.gd .tfq .it{display:inline-flex;align-items:center;gap:3px;margin-right:6px}
.gd .tfq button{min-width:30px;height:30px;border:1.5px solid var(--line);border-radius:7px;background:#fff;font-weight:700;padding:0 6px}
.gd .tfq button.on.y{background:var(--ok);color:#fff;border-color:var(--ok)}.gd .tfq button.on.n{background:var(--bad);color:#fff;border-color:var(--bad)}
.gd .tfq button.key{box-shadow:0 0 0 3px var(--c3) inset}
.gd .tfq.ok{border-color:var(--ok);background:#E6F5F2}.gd .tfq.no{border-color:var(--bad);background:#FDECE8}.gd .tfq.part{border-color:var(--c2);background:#FFF4DC}
.gd .saq input{width:110px}
.gd .res{grid-column:1/-1;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gd .res .big{font-size:2rem;font-weight:800}
.gd .tablewrap table{font-size:.88rem}
.qlist-head{flex-wrap:wrap}
.qlist-head .btn+.btn{margin-left:6px}
.aq .types{display:flex;gap:6px;flex-wrap:wrap}
.aq .types label{border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;flex-direction:row!important;align-items:center;gap:6px}
.aq .types label:has(input:checked){border-color:var(--ink);background:var(--paper)}
.aq .orow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.aq .orow b{min-width:22px}
.aq .orow .tfbtns button{padding:5px 12px}
.aq .pv{background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;min-height:40px}
.aq .pv img{max-height:140px;display:block;margin-top:6px;border-radius:6px}
.aq textarea{min-height:80px}
dialog.xd{border:2px solid var(--ink);border-radius:20px;padding:0;max-width:min(620px,94vw);width:100%;color:var(--ink)}
dialog.xd[open]{display:flex;flex-direction:column;max-height:92vh}
.xd .bd{overflow:auto;min-height:0}
.xd .hd,.xd .ft{flex:none}
dialog.xd::backdrop{background:rgba(19,41,75,.45)}
.xd .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--line)}
.xd .hd h3{margin:0;font-size:1.2rem}
.xd .hd button{margin-left:auto}
.xd .bd{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.xd .bd .full{grid-column:1/-1}
.xd .bd label{font-size:.88rem;font-weight:600;display:flex;flex-direction:column;gap:4px}
.xd .bd label.ck{flex-direction:row;align-items:center;font-weight:500}
.xd .ft{padding:12px 18px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center;border-top:2px solid var(--line)}
@media (max-width:560px){.xd .bd{grid-template-columns:1fr}}
.sapad{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px}
.sadisp{font-size:1.8rem;font-weight:800;text-align:center;min-height:56px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sadisp .muted{font-size:1rem;font-weight:500;letter-spacing:0}
.sakeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sakeys button{padding:12px 0;font-size:1.35rem;font-weight:800;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.sakeys button:active{background:var(--grid2)}
.hsa{background:#fff;border:2px dashed var(--ink);border-radius:16px;padding:18px;text-align:center;font-size:1.25rem;font-weight:600}
.hsakey{display:inline-block;background:var(--ok);color:#fff;font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800;padding:8px 28px;border-radius:14px;margin:6px 0 12px}
.sadist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sadist span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.05rem}
.sadist span.ok{border-color:var(--ok);background:#E6F5F2}
[hidden]{display:none!important}
.tfbox{margin:10px 0 8px 40px;display:grid;gap:6px}
@media (max-width:560px){.tfbox{margin-left:0}}
.tfrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;font-size:.92rem}
.tfrow b{min-width:18px}
.tfbtns{display:flex;gap:4px}
.tfbtns button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:.85rem}
.tfbtns button.on.y{background:var(--ok);border-color:var(--ok);color:#fff}
.tfbtns button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}
.tftag{display:inline-block;font-size:.75rem;padding:2px 8px;margin-right:6px;border-radius:999px;background:var(--c3);color:#fff;font-weight:700;vertical-align:middle}
.stf{display:grid;gap:10px}
.stf .row1{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.stf .st{font-size:1.02rem;margin-bottom:8px}
.stf .yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stf .yn button{border:2px solid var(--ink);border-radius:10px;padding:10px;font-weight:800;font-size:1rem;background:#fff}
.stf .yn button.on.y{background:var(--ok);border-color:var(--ok);color:#fff}
.stf .yn button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}
.htf{display:grid;gap:10px}
.htf .r{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-size:clamp(1rem,1.8vw,1.35rem)}
.htf .r .k{font-weight:800;font-size:1.3em}
.htf .r .v{font-weight:800;padding:4px 14px;border-radius:10px;color:#fff;white-space:nowrap}

  // Công thức MathType dán dưới dạng ảnh WMF/EMF: dữ liệu gốc nằm trong bản ghi "AppsMFCC"
  function metaMath(u8){
    const sig = 'AppsMFCC', ds = 'Design Science, Inc.';
    const chunks = [];

  /* ---------- Đọc file .docx ---------- */
  async function read(arrayBuffer, deps){
    const {JSZip, CFB, DOMParser} = deps;

        raw[id] = {numId: np && kid(np,'w:numId') ? attr(kid(np,'w:numId'),'w:val') : null, ilvl: np && kid(np,'w:ilvl') ? attr(kid(np,'w:ilvl'),'w:val') : null, based: bo ? attr(bo,'w:val') : null};

  const table = (rows, widths, border = true) => `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(k => `<w:${k} w:val="${border ? 'single' : 'nil'}" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="60" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows.map(r => `<w:tr>${r}</w:tr>`).join('')}</w:tbl>`;
  const PAGEW = 9922; // A4, lề trái 2 cm, phải 1,5 cm

  /* Bố cục phương án: 4 cột / 2 cột / mỗi dòng một phương án */
  function optLen(o){
    if(/!\[[^\]]*\]\(/.test(o)){ const w = +(o.match(/!\[w=(\d+)\]/) || [])[1] || 400; if(w > 150) return 99; }
    const plain = o.replace(/!\[[^\]]*\]\([^)]*\)/g, 'xxxxxxxx').replace(/\$([^$]*)\$/g, (_, t) => 'x'.repeat(Math.ceil(t.replace(/\\[a-zA-Z]+/g,'x').replace(/[{}^_ ]/g,'').length * 0.9)));
    return plain.length + (/\\d?frac|\\sqrt|\\int|\\sum|\\lim|begin/.test(o) ? 4 : 0);
  }

  function buildExam(d, info, D0){
    const D = D0 || Doc(), body = [];
    // Tiêu đề
    const left = [P(D.run(info.unit1 || 'SỞ GIÁO DỤC VÀ ĐÀO TẠO', {sz: 24}), {jc:'center', after:0}), P(D.run(info.unit2 || '', {b:true, sz: 24}), {jc:'center', after:0}), P(D.run('(Đề thi có ' + d.items.length + ' câu)', {i:true, sz: 22}), {jc:'center', after:0})].join('');
    const right = [P(D.run(info.examName || 'ĐỀ KIỂM TRA', {b:true, sz: 24}), {jc:'center', after:0}), P(D.run('Môn: ' + (info.subject || 'TOÁN'), {b:true, sz: 24}), {jc:'center', after:0}), P(D.run('Thời gian làm bài: ' + info.minutes + ' phút, không kể thời gian phát đề', {i:true, sz: 22}), {jc:'center', after:0})].join('');
    body.push(table([cell(left, 3900) + cell(right, 6022)], [3900, 6022], false));
    body.push(P('', {after: 60}));
    body.push(table([cell(P(D.run('Họ, tên thí sinh: ……………………………………………    Số báo danh: ……………………', {sz: 24}), {after:0}), 7800) + cell(P(D.run('Mã đề ' + d.code, {b:true, sz: 26}), {jc:'center', after:0}), 2122, {fill:'F2F2F2'})], [7800, 2122], true));
    body.push(P('', {after: 60}));
    const parts = [
      {k:'mc', title:'PHẦN I. Câu trắc nghiệm nhiều phương án lựa chọn.', note: n => `Thí sinh trả lời từ câu 1 đến câu ${n}. Mỗi câu hỏi thí sinh chỉ chọn một phương án.`},
      {k:'tf', title:'PHẦN II. Câu trắc nghiệm đúng sai.', note: n => `Thí sinh trả lời từ câu 1 đến câu ${n}. Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chọn đúng hoặc sai.`},
      {k:'sa', title:'PHẦN III. Câu trắc nghiệm trả lời ngắn.', note: n => `Thí sinh trả lời từ câu 1 đến câu ${n}.`}
    ];
    const multi = new Set(d.items.map(x => x.k)).size > 1 || d.items.some(x => x.k !== 'mc');
    let globalNo = 0;
    for(const part of parts){
      const items = d.items.filter(x => x.k === part.k); if(!items.length) continue;
      if(multi){ body.push(P(D.run(part.title + ' ', {b:true}) + D.run(part.note(items.length)), {before: 120, after: 60, keep:true})); }
      items.forEach((x, idx) => {
        const no = multi ? idx + 1 : ++globalNo;
        const lines = String(x.text).split('\n');
        lines.forEach((ln, li) => body.push(P((li === 0 ? D.run('Câu ' + no + '. ', {b:true, color:'1F3864'}) : '') + D.rich(ln), {after: 30, keep:true})));
        if(x.k === 'mc'){
          const L = Math.max(...x.options.map(optLen));
          const lab = k => D.run('ABCD'[k] + '. ', {b:true, color:'1F3864'});
          if(L <= 16 && x.options.length === 4){ const tb = [2480, 4961, 7441].map(v => v + 280); body.push(P(x.options.map((o, k) => (k ? TAB : '') + lab(k) + D.rich(o)).join(''), {tabs: tb, ind: 280, after: 60})); }
          else if(L <= 38){ for(let r = 0; r < x.options.length; r += 2) body.push(P(lab(r) + D.rich(x.options[r]) + (x.options[r+1] != null ? TAB + lab(r+1) + D.rich(x.options[r+1]) : ''), {tabs:[4961 + 280], ind: 280, after: 40, keep: r + 2 < x.options.length})); }
          else x.options.forEach((o, k) => body.push(P(lab(k) + D.rich(o), {ind: 280, after: 40, keep: k < x.options.length - 1})));
        } else if(x.k === 'tf'){
          x.options.forEach((o, k) => body.push(P(D.run('abcd'[k] + ') ', {b:true, color:'1F3864'}) + D.rich(o), {ind: 280, after: 40, keep: k < x.options.length - 1})));
        }
      });
    }
    body.push(P(D.run('------------- HẾT -------------', {b:true}), {jc:'center', before: 200}));
    body.push(P(D.run('Thí sinh không được sử dụng tài liệu. Cán bộ coi thi không giải thích gì thêm.', {i:true, sz: 22}), {jc:'center'}));
    return {xml: body.join(''), media: D.media};
  }

  function buildKey(papers, info, D0){
    const D = D0 || Doc(), body = [];
    body.push(P(D.run('ĐÁP ÁN', {b:true, sz: 30}), {jc:'center', after: 40}));
    body.push(P(D.run((info.examName || '') + ' – Môn ' + (info.subject || 'Toán'), {b:true}), {jc:'center', after: 160}));
    const C = (t, o = {}) => P(D.run(t, o), {jc:'center', after:0});
    papers.forEach((d, pi) => {
      body.push(P(D.run('Mã đề ' + d.code, {b:true, sz: 26, color:'1F3864'}), {before: pi ? 240 : 0, after: 80, keep:true}));
      const mc = d.items.filter(x => x.k === 'mc'), tf = d.items.filter(x => x.k === 'tf'), sa = d.items.filter(x => x.k === 'sa');
      const multi = tf.length || sa.length;
      if(mc.length){
        if(multi) body.push(P(D.run('Phần I', {b:true}) + D.run(' (mỗi câu đúng 0,25 điểm)', {i:true}), {after: 40, keep:true}));
        for(let s = 0; s < mc.length; s += 12){
          const chunk = mc.slice(s, s + 12), w0 = 1300, w = Math.floor((PAGEW - w0) / 12);
          const widths = [w0, ...chunk.map(() => w)];
          body.push(table([
            cell(C('Câu', {b:true}), w0, {fill:'E7EEF7'}) + chunk.map((_, j) => cell(C(String(s + j + 1), {b:true}), w, {fill:'E7EEF7'})).join(''),
            cell(C('Đáp án', {b:true}), w0) + chunk.map(x => cell(C('ABCD'[x.answer], {b:true, color:'C00000'}), w)).join(''),
            cell(C('Câu gốc', {i:true, sz: 18}), w0) + chunk.map(x => cell(C(String(x.src), {i:true, sz: 18}), w)).join('')
          ], widths));
          body.push(P('', {after: 60}));
        }
      }
      if(tf.length){
        body.push(P(D.run('Phần II', {b:true}) + D.run(' (mỗi câu: đúng 1 ý 0,1 · 2 ý 0,25 · 3 ý 0,5 · 4 ý 1 điểm)', {i:true}), {after: 40, keep:true}));
        const w0 = 1300, w = 1500, wg = 1300;
        body.push(table([
          cell(C('Câu', {b:true}), w0, {fill:'E7EEF7'}) + ['a)','b)','c)','d)'].map(t => cell(C(t, {b:true}), w, {fill:'E7EEF7'})).join('') + cell(C('Câu gốc', {i:true, sz: 18}), wg, {fill:'E7EEF7'}),
          ...tf.map((x, j) => cell(C(String(j + 1), {b:true}), w0) + [0,1,2,3].map(k => cell(C(x.tf[k] === 1 ? 'Đúng' : x.tf[k] === 0 ? 'Sai' : '?', {b:true, color: x.tf[k] === 1 ? '006100' : 'C00000'}), w)).join('') + cell(C(String(x.src), {i:true, sz: 18}), wg))
        ], [w0, w, w, w, w, wg]));
        body.push(P('', {after: 60}));
      }
      if(sa.length){
        body.push(P(D.run('Phần III', {b:true}) + D.run(' (mỗi câu đúng 0,5 điểm)', {i:true}), {after: 40, keep:true}));
        const w0 = 1300, w = Math.min(1400, Math.floor((PAGEW - w0) / sa.length));
        body.push(table([
          cell(C('Câu', {b:true}), w0, {fill:'E7EEF7'}) + sa.map((_, j) => cell(C(String(j + 1), {b:true}), w, {fill:'E7EEF7'})).join(''),
          cell(C('Đáp số', {b:true}), w0) + sa.map(x => cell(C(String(x.sa).split(/[|;]/)[0], {b:true, color:'C00000'}), w)).join(''),
          cell(C('Câu gốc', {i:true, sz: 18}), w0) + sa.map(x => cell(C(String(x.src), {i:true, sz: 18}), w)).join('')
        ], [w0, ...sa.map(() => w)]));
      }
    });
    body.push(P(D.run('“Câu gốc” là số thứ tự của câu trong bộ câu hỏi trên Toán Vui, giúp đối chiếu khi chấm và chữa bài.', {i:true, sz: 20}), {before: 200}));
    return {xml: body.join(''), media: D.media};
  }

  const PAGEBREAK = '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  /* papers: [{code, items:[{k:'mc'|'tf'|'sa', text, options, answer, tf, sa, src}]}]

  async function exportAll(JSZip, papers, info, mode){
    if(mode === 'single'){
      const D = Doc(), parts = papers.map(d => buildExam(d, info, D).xml);
      const key = buildKey(papers, info, D).xml;
      const xml = parts.join(PAGEBREAK) + PAGEBREAK + key;
      return [{name: `${info.fileBase}_${papers.length}_ma_de_va_dap_an.docx`, data: await pack(JSZip, {xml, media: D.media}, info.examName)}];
    }

  if(synth){ load(); if('onvoiceschanged' in synth) synth.onvoiceschanged = load; setTimeout(load, 600); }
  const settings = () => Object.assign({name:'', rate:1, pitch:1.1}, LS.get('tv-voice', {}));
  const vi = () => voices.filter(v => /^vi\b|^vi[-_]/i.test(v.lang));
  const isFemale = v => FEMALE.test(v.name) || (!MALE.test(v.name) && /google/i.test(v.name));
  function list(){ return vi().slice().sort((a,b) => (isFemale(b) - isFemale(a)) || ((/online|natural/i.test(b.name)) - (/online|natural/i.test(a.name)))); }
  function pick(){
    const st = settings(), vs = list();
    return vs.find(v => v.name === st.name) || vs.find(v => /hoai\s*my|hoaimy/i.test(v.name)) || vs.find(isFemale) || vs[0] || null;
  }
  function clean(t){
    return String(t||'').replace(/!\[[^\]]*\]\([^)]*\)/g,' ').replace(/\$([^$]*)\$/g, (_, m) => ' ' + m.replace(/\\[a-zA-Z]+/g,' ').replace(/[{}^_\\]/g,' ') + ' ').replace(/\s+/g,' ').trim();
  }
  function chunks(t){
    const parts = t.split(/(?<=[.!?…;:])\s+|\n+/); const out = [];
    for(let p of parts){ p = p.trim(); while(p.length > 180){ let k = p.lastIndexOf(',', 180); if(k < 60) k = p.lastIndexOf(' ', 180); if(k < 60) k = 180; out.push(p.slice(0,k+1)); p = p.slice(k+1).trim(); } if(p) out.push(p); }
    return out;
  }
  function speak(text, {onstart, onend} = {}){
    if(!synth) return false;
    synth.cancel();
    const st = settings(), v = pick(), parts = chunks(clean(text));
    if(!parts.length) return false;
    speaking = true; onstart && onstart();
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'vi-VN';
      u.rate = st.rate; u.pitch = st.pitch;
      if(i === parts.length - 1){ u.onend = u.onerror = () => { speaking = false; onend && onend(); }; }
      synth.speak(u);
    });
    return true;
  }
  return {
    supported: !!synth, list, pick, isFemale, settings,
    save(p){ LS.set('tv-voice', Object.assign(settings(), p)); },
    speak, stop(){ if(synth) synth.cancel(); speaking = false; }, isSpeaking: () => speaking,
    onChange(f){ listeners = [f]; }
  };
})();

/* ============ Đọc câu hỏi: văn bản / CSV / Excel ============ */
function parseText(txt){
  const lines = String(txt).replace(/\r/g,'').split('\n');
  const qs = []; let cur = null, defaultTime = null;
  const push = () => {
    if(cur && cur.text.trim() && cur.saAns != null && cur.options.length === 0){ cur.kind = 'sa'; cur.sa = cur.saAns; delete cur.saAns; cur.text = cur.text.trim(); qs.push(syncSA(cur)); return; }
    if(cur && cur.text.trim() && cur.options.length >= 2){
      if(isTF(cur)){ cur.tf = cur.tf || []; syncTF(cur); }
      else if(cur.answer >= cur.options.length) cur.answer = -1;
      cur.text = cur.text.trim(); qs.push(cur);
    }
  };
  for(const raw of lines){
    const line = raw.trim(); if(!line || /^ghi\s*chú\s*[:.]/i.test(line)) continue;
    let m;
    if(/^(chuyên\s*đề|chuyen\s*de)\s*:/i.test(line)) continue;
    if(cur && isTF(cur) && (m = line.match(/^(?:đáp\s*án|dap\s*an|đa|answer|key)\s*[:.\-]?\s*(.*)$/i))){ cur.tf = parseTFKey(m[1]); continue; }
    if(cur && cur.options.length === 0 && (m = line.match(/^(?:đáp\s*số|dap\s*so|đáp\s*án|dap\s*an|trả\s*lời|kết\s*quả)\s*[:.\-]?\s*([-+]?[\d.,/]+(?:\s*[|;]\s*[-+]?[\d.,/]+)*)\s*$/i))){ cur.saAns = m[1].replace(/\s+/g,''); continue; }
    if((m = line.match(/^(?:đáp\s*án|dap\s*an|đa|answer|key)\s*[:.\-]?\s*([A-Da-d])\b/i))){ if(cur) cur.answer = LETTERS.indexOf(m[1].toUpperCase()); continue; }
    // Ý a) b) c) d) của câu Đúng/Sai
    if(cur && (cur.options.length === 0 || isTF(cur)) && (m = line.match(/^\(?([a-d])\)\s*(.*)$/))){
      const k = TFL.indexOf(m[1]);
      if(k === cur.options.length && k < 4){
        cur.kind = 'tf4';
        let st = m[2].trim(), v = -1;
        const mm = st.match(/^(.*?)\s*[\[(]\s*(đúng|sai|đ|s)\s*[\])]\s*$/i);   // "a) ... (Đúng)"
        if(mm){ st = mm[1]; v = /^(đúng|đ)$/i.test(mm[2]) ? 1 : 0; }
        cur.options.push(st); cur.tf = cur.tf || []; cur.tf[k] = v;
        continue;
      }
    }
    if((m = line.match(/^(?:thời\s*gian|thoi\s*gian|time)\s*[:.\-]?\s*(\d+)/i))){ if(cur && cur.options.length) cur.time = +m[1]; else defaultTime = +m[1]; continue; }
    // Nhiều phương án trên cùng một dòng: "A. 1   B. 2   C. 3   D. 4"
    if(cur && cur.options.length === 0 && /^\*?\s*A\s*[.)]/.test(line) && /\s\*?\s*B\s*[.)]/.test(line)){
      const parts = line.split(/(?:^|\s+)(\*?)\s*([A-D])\s*[.)]\s*/);
      for(let i = 1; i + 1 < parts.length; i += 3){
        const idx = LETTERS.indexOf(parts[i+1]);
        if(idx === cur.options.length){ cur.options.push((parts[i+2]||'').trim()); if(parts[i]) cur.answer = idx; }
      }
      continue;
    }
    if((m = line.match(/^(\*)?\s*([A-Da-d])\s*[.):]\s*(.*)$/)) && cur){
      const idx = LETTERS.indexOf(m[2].toUpperCase());
      if(idx === cur.options.length && cur.options.length < 4){ cur.options.push(m[3].trim()); if(m[1]) cur.answer = idx; continue; }
    }
    const qm = line.match(/^(?:câu|cau|question|q)\s*\d+\s*[:.)\-]?\s*(.*)$/i);
    if(cur && isTF(cur) && cur.options.length >= 2){   // "a) Đúng  b) Sai  c) Đúng  d) Đúng" (sau Lời giải)
      const all = [...line.matchAll(/(?:^|[\s;,.])\(?([a-d])\)\s*[:.\-]?\s*(đúng|sai)\b/gi)];
      if(all.length >= 2 || (all.length === 1 && /^\(?[a-d]\)\s*[:.\-]?\s*(đúng|sai)\b/i.test(line))){ cur.tf = cur.tf || []; all.forEach(mm => cur.tf[TFL.indexOf(mm[1].toLowerCase())] = /^đúng$/i.test(mm[2]) ? 1 : 0); continue; }
      if(/^lời\s*giải\b/i.test(line)) continue;
    }
    if(cur && isTF(cur) && !qm && cur.options.length){ cur.options[cur.options.length-1] += ' ' + line; continue; }
    if(qm || !cur || cur.options.length){ push(); cur = {text: qm ? qm[1] : line, options: [], answer: -1, time: null, image: null}; }
    else cur.text += '\n' + line;
  }
  push();
  if(defaultTime && !qs.length) return {qs, defaultTime};
  return {qs, defaultTime};
}
function parseCSV(text){
  text = String(text).replace(/^\uFEFF/,'');
  const first = text.split('\n')[0] || '';
  const count = ch => { let n=0,q=false; for(const c of first){ if(c==='"') q=!q; else if(c===ch && !q) n++; } return n; };
  const sep = count('\t') > 0 ? '\t' : (count(';') > count(',') ? ';' : ',');
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(f); f = ''; }
    else if(c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function rowsToQs(rows){
  const qs = [];
  for(const r of rows){
    if(!r || !r.length) continue;
    const c = r.map(x => String(x ?? '').trim());
    if(!c[0]) continue;
    let a = (c[5] || '').toUpperCase();
    const tfk = parseTFKey(c[5]);
    if(!/^[A-D]$/.test(a) && tfk.length >= 2 && tfk.every(v => v >= 0) && /đ|đúng|sai|s|d/i.test(c[5])){
      const st = c.slice(1,5).filter(x => x !== '');
      if(st.length >= 2){ const time = parseInt(c[6], 10); qs.push(syncTF({text: c[0], options: st, kind: 'tf4', tf: tfk, answer: -1, time: time > 0 ? time : null, image: /^https?:\/\//i.test(c[7]||'') ? c[7] : null})); continue; }
    }
    if(!c[1] && !c[2] && c[5] && /^[-+]?[\d.,/]+([|;][-+]?[\d.,/]+)*$/.test(c[5].replace(/\s+/g,''))){
      const time = parseInt(c[6], 10);
      qs.push(syncSA({text: c[0], options: [], kind: 'sa', sa: c[5].replace(/\s+/g,''), answer: 0, time: time > 0 ? time : null, image: /^https?:\/\//i.test(c[7]||'') ? c[7] : null})); continue;
    }
    let ans = /^[A-D]$/.test(a) ? LETTERS.indexOf(a) : (/^[1-4]$/.test(a) ? +a - 1 : -2);
    if(ans === -2) continue; // dòng tiêu đề hoặc dòng không hợp lệ
    const options = c.slice(1,5); while(options.length && !options[options.length-1]) options.pop();
    if(options.length < 2 || options.some(o => !o)) continue;
    const time = parseInt(c[6], 10);
    qs.push({text: c[0], options, answer: ans < options.length ? ans : -1, time: time > 0 ? time : null, image: /^https?:\/\//i.test(c[7]||'') ? c[7] : null});
  }
  return qs;
}

let sets = {};
/* Lưu bộ câu hỏi bằng IndexedDB (chứa được nhiều hình hơn localStorage); localStorage chỉ dùng dự phòng */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try{ const r = indexedDB.open('toanvui', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); }
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }));
  return { get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => st.put(v, k)) };
})();

function urlProblem(u){
  if(!u) return 'file';
  if(/^file:/i.test(u)) return 'file';
  if(!/^https?:\/\//i.test(u)) return 'file';
  if(/^https?:\/\/(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u)) return 'local';
  if(/^https?:\/\/[^/]*_/i.test(u)) return 'underscore';
  if(!/^https?:\/\/([^/]+\.[a-z]{2,}|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/|$)/i.test(u)) return 'nodomain';
  return null;
}
function setBase(v){
  v = String(v||'').trim().replace(/\\/g,'/').replace(/^(https?):\/*/i,'$1://');
  if(v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
  v = v.replace(/[?#].*$/,'');
  if(/^https?:\/\/[^/]+$/i.test(v)) v += '/';
  LS.set('tv-base', v); return v;
}
function baseUrl(){
  if(/^https?:/.test(location.protocol)) return location.origin + location.pathname;
  return LS.get('tv-base', '');
}

function fillVoices(){

}
function qCard(q, i, s){
  return `<article class="qcard ${q.answer<0 && !q.off ?'warn':''} ${q.off ? 'off' : ''}">
    <div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${q.kind === 'tf' ? '<span class="pill" style="font-size:.75rem;padding:2px 8px;margin-right:6px">Đúng/Sai</span>' : ''}${isTF(q) ? '<span class="tftag">Đúng/Sai 4 ý</span>' : ''}${isSA(q) ? '<span class="tftag" style="background:var(--c2)">Trả lời ngắn</span>' : ''}${rich(q.text)}</div></div>
    ${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="Hình minh họa câu ${i+1}">` : ''}
    ${isSA(q) ? `<div class="tfbox"><label class="row" style="gap:8px;font-weight:600">Đáp số đúng <input type="text" data-sa="${i}" value="${esc(q.sa || '')}" placeholder="ví dụ 0,4" style="width:160px"></label><span class="muted" style="font-size:.82rem">0,4 = 0.4 = 2/5 đều chấm đúng. Nhiều đáp số chấp nhận: ngăn cách bằng | </span></div>` :
    isTF(q) ? `<div class="tfbox">${q.options.map((o,k) => `<div class="tfrow"><b>${TFL[k]})</b><span>${rich(o)}</span><span class="tfbtns"><button class="${q.tf && q.tf[k] === 1 ? 'on y' : ''}" data-act="settf" data-q="${i}" data-k="${k}" data-v="1">Đúng</button><button class="${q.tf && q.tf[k] === 0 ? 'on n' : ''}" data-act="settf" data-q="${i}" data-k="${k}" data-v="0">Sai</button></span></div>`).join('')}</div>`
    : `<div class="qopts">${q.options.map((o,k) => `<button class="qopt ${k===q.answer?'right':''}" data-act="setans" data-q="${i}" data-k="${k}" title="Chọn làm đáp án đúng"><b>${LETTERS[k]}.</b>${rich(o)}${k===q.answer?' ✓':''}</button>`).join('')}</div>`}
    ${q.answer<0 ? (isSA(q) ? '<p class="warn-text">Chưa có đáp số — nhập đáp số đúng vào ô trên.</p>' : isTF(q) ? '<p class="warn-text">Chưa đủ đáp án — bấm Đúng hoặc Sai cho từng ý.</p>' : '<p class="warn-text">Chưa có đáp án — bấm vào phương án đúng.</p>') : ''}
    ${needsFix(q) ? '<p class="fixme">Câu này có hình hoặc công thức trong Word chưa chuyển được. Bấm “Sửa” để gõ lại, hoặc “Thêm ảnh” để chèn ảnh chụp.</p>' : ''}
    ${q.solution ? `<details class="sol"><summary>Lời giải</summary><div>${rich(q.solution)}</div></details>` : ''}
    <div class="qmeta">
      <label class="usebox"><input type="checkbox" data-use="${i}" ${q.off ? '' : 'checked'}> Dùng</label>
      <label>Thời gian <input type="number" min="5" max="300" data-qtime="${i}" value="${q.time||''}" placeholder="${s.time}"> giây</label>
      <button class="btn small" data-act="img" data-q="${i}">${q.image ? 'Đổi ảnh' : 'Thêm ảnh'}</button>
      ${q.image ? `<button class="btn small" data-act="rmimg" data-q="${i}">Bỏ ảnh</button>` : ''}
      <button class="btn small" data-act="editq" data-q="${i}">Sửa</button>
      <button class="btn small" data-act="up" data-q="${i}" ${i===0?'disabled':''} aria-label="Đưa lên">↑</button>
      <button class="btn small" data-act="delq" data-q="${i}">Xóa</button>
    </div>
  </article>`;
}
function addQuestions(qs, label){
  const s = curSet();
  if(!qs.length){ toast('Không đọc được câu hỏi nào. Kiểm tra lại định dạng (bấm “Cách soạn câu hỏi”).', 5000); return; }
  s.questions.push(...qs); saveSets(); renderSetup();
  const miss = qs.filter(q => q.answer < 0 && !q.off).length, offTf = qs.filter(q => (q.kind === 'tf' || isTF(q) || isSA(q)) && q.off).length;
  toast(`Đã thêm ${qs.length} câu ${label||''}` + (miss ? ` — ${miss} câu chưa có đáp án.` : '.') + (offTf ? ` ${offTf} câu Đúng/Sai hoặc trả lời ngắn chưa có đáp án đang tạm tắt.` : ''));
}
async function onFile(e){

  try{
    if(/\.docx$/i.test(f.name)) return importDocx(f);
    if(/\.doc$/i.test(f.name)) return toast('File .doc đời cũ: hãy mở bằng Word rồi “Lưu thành” .docx trước.', 5000);

      const d = JSON.parse(await f.text()); const qs = (d && Array.isArray(d.questions)) ? d.questions : (Array.isArray(d) ? d : []);
      const ok = qs.filter(q => q && q.text && Array.isArray(q.options) && (q.options.length >= 2 || q.kind === 'sa')).map(q => ({text:String(q.text), options:q.options.slice(0,4).map(String), answer: Number.isInteger(q.answer) ? q.answer : -1, time: q.time || null, image: q.image || null, solution: q.solution ? String(q.solution) : '', ...(q.kind === 'tf' ? {kind: 'tf'} : {}), ...(q.kind === 'tf4' ? {kind: 'tf4', tf: Array.isArray(q.tf) ? q.tf : []} : {}), ...(q.kind === 'sa' ? {kind: 'sa', sa: String(q.sa || '')} : {}), ...(q.off ? {off: true} : {}), ...(q.autoOff ? {autoOff: true} : {})})).map(q => syncSA(syncTF(q)));
      if(d && d.name && !curSet().questions.length){ curSet().name = String(d.name); if(d.time) curSet().time = d.time; }
      return addQuestions(ok, 'từ file bộ câu hỏi');

async function importDocx(f){
  if(!window.JSZip || !(window.XLSX && XLSX.CFB)) return toast('Chưa tải được thư viện đọc Word. Kiểm tra mạng rồi tải lại trang.', 5000);
  toast('Đang đọc file Word…', 20000);
  try{
    const r = await DocImport.read(await f.arrayBuffer(), {JSZip: window.JSZip, CFB: XLSX.CFB, DOMParser: window.DOMParser, metafiles: false});
    const urls = {};
    let metaFail = 0;
    for(const [i, m] of Object.entries(r.media)){
      urls[i] = await shrinkImage('data:' + m.mime + ';base64,' + m.base64);
    }
    const fill = t => String(t||'').replace(/!\[([^\]]*)\]\(@(\d+)\)/g, (_, alt, i) => urls[i] ? '![' + alt + '](' + urls[i] + ')' : '[hình]');
    const qs = r.qs.map(q => { const o = {...q, text: fill(q.text), options: q.options.map(fill), solution: fill(q.solution)}; delete o.sec; delete o.no; if(isTF(o)) syncTF(o); if(isSA(o)) syncSA(o); if((isTF(o) || isSA(o)) && o.answer < 0){ o.off = true; o.autoOff = true; } return o; });
    const s = curSet();

    addQuestions(qs, 'từ Word');
    const fix = qs.filter(needsFix).length;
    const tf = qs.filter(isTF).length, tfNo = qs.filter(q => isTF(q) && q.answer < 0).length, sa = qs.filter(isSA).length, saNo = qs.filter(q => isSA(q) && q.answer < 0).length;
    toast(`Đã thêm ${qs.length - tf - sa} câu trắc nghiệm` + (tf ? ` + ${tf} câu Đúng/Sai` : '') + (sa ? ` + ${sa} câu trả lời ngắn` : '') + ` · ${r.stats.equations - r.stats.failed}/${r.stats.equations} công thức · ${r.stats.images - metaFail} hình`
      + (r.stats.skippedImages ? ` · ${r.stats.skippedImages} hình dạng WMF/EMF chưa hiển thị được` : '')
      + (saNo ? ` · ${saNo} câu trả lời ngắn chưa có đáp số (đang tắt, nhập đáp số để bật)` : '')
      + (tfNo ? ` · ${tfNo} câu Đúng/Sai chưa có đáp án (đang tắt, bấm Đúng/Sai cho từng ý để bật)` : '')
      + (fix ? ` · ${fix} câu cần xem lại (tô vàng)` : ''), 12000);
  }catch(err){ toast('Không đọc được file Word: ' + err.message, 6000); }
}
function shrinkImage(dataUrl, max=720){
  return new Promise(res => {
    if(dataUrl.length < 60000) return res(dataUrl);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      const out = c.toDataURL('image/jpeg', .85); res(out.length < dataUrl.length ? out : dataUrl);
    };
    img.onerror = () => res(dataUrl); img.src = dataUrl;
  });
}

function shuffleArr(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildGameQuestions(s){
  let qs = s.questions.map((q, i) => ({...JSON.parse(JSON.stringify(q)), src: i})).filter(q => !q.off);

  if(s.shuffleA) qs.forEach(q => {
    if(isTF(q) || isSA(q)) return;
    if(q.options.some(o => /(^|[^\p{L}])[A-D]([^\p{L}]|$)/u.test(o.replace(/\$[^$]*\$/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'')))) return; // có nhắc tới A/B/C/D
    const perm = shuffleArr(q.options.map((_, i) => i));
    q.options = perm.map(i => q.options[i]); q.answer = perm.indexOf(q.answer);
  });

}
function buildPool(s){ return s.questions.map((q, i) => ({...JSON.parse(JSON.stringify(q)), src: i})).filter(q => !q.off); }
const canShuffleOpts = q => !isTF(q) && !isSA(q) && !q.options.some(o => /(^|[^\p{L}])[A-D]([^\p{L}]|$)/u.test(o.replace(/\$[^$]*\$/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'')));

  const ex = game.exam, pool = game.questions;
  const order = ex.struct ? pickByStruct(pool.map((q, i) => ({q, i})), ex.struct, false).map(x => x.i) : shuffleArr(pool.map((_, i) => i)).slice(0, ex.n);
  return order.map(qi => {
    const q = pool[qi], perm = (ex.shuffleA && canShuffleOpts(q)) ? shuffleArr(q.options.map((_, k) => k)) : q.options.map((_, k) => k);
    return isSA(q) ? {qi, perm: [], answer: 0, sa: q.sa} : isTF(q) ? {qi, perm, answer: 0, tf: q.tf.slice()} : {qi, perm, answer: perm.indexOf(q.answer)};

function gradePaper(paper, ans){
  let raw = 0, max = 0; const det = [];
  paper.items.forEach((x, i) => {
    const w = x.k === 'tf' ? 1 : x.k === 'sa' ? 0.5 : 0.25; max += w;
    const a = ans[i];
    if(x.k === 'mc'){ const ok = a === x.answer; if(ok) raw += w; det.push({ok, st: ok ? 'ok' : 'no', pts: ok ? w : 0}); }
    else if(x.k === 'tf'){ const k = Array.isArray(a) ? a.filter((v, j) => v === x.tf[j]).length : 0; const f = tfFrac(k, x.tf.length); raw += f * w; det.push({ok: k === x.tf.length, k, st: k === x.tf.length ? 'ok' : k ? 'part' : 'no', pts: f * w}); }
    else { const ok = saMatch(a || '', x.sa); if(ok) raw += w; det.push({ok, st: ok ? 'ok' : 'no', pts: ok ? w : 0}); }
  });
  return {raw, max, d10: max ? Math.round(raw / max * 1000) / 100 : 0, det};
}

}

async function openMqtt(){
  const g = game;
  for(let i = 0; i < BROKERS.length; i++){
    if(game !== g) return;
    const base = mqTopic(g.code);
    let c;
    try{ c = await mqttConnect(BROKERS[i], {will: {topic: base + '/host', payload: '', retain: true, qos: 1}}); }
    catch(e){ continue; }
    if(game !== g){ c.end(true); return; }
    g.mq = {client: c, broker: i, base};
    const announce = () => c.publish(base + '/host', JSON.stringify({t:'host', title: g.title, ts: Date.now()}), {retain: true, qos: 1});
    c.subscribe(base + '/up', {qos: 1}); announce();
    c.on('connect', () => { c.subscribe(base + '/up', {qos: 1}); announce(); g.net.mqtt = 'ok'; netChanged(); });
    c.on('offline', () => { g.net.mqtt = 'wait'; netChanged(); });
    c.on('message', (topic, buf) => {
      if(game !== g || topic !== base + '/up') return;
      let d; try{ d = JSON.parse(buf.toString()); }catch(e){ return; }
      onMqttUp(d);
    });
    g.net.mqtt = 'ok'; netChanged(); return;
  }
  g.net.mqtt = 'fail'; netChanged();
}

}

}

const qTimeOf = q => q.time || (isTF(q) ? Math.max(game.time, 60) : isSA(q) ? Math.max(game.time, 45) : game.time);
function qPayload(i){
  const q = game.questions[i];
  return {t:'q', idx:i, total: game.questions.length, text:q.text, options:q.options, image:q.image||null, time: qTimeOf(q), kind: isTF(q) ? 'tf4' : isSA(q) ? 'sa' : 'mc'};
}
function onAnswer(p, d){
  const i = game.qIndex;
  if(game.phase !== 'question' || d.idx !== i || p.answers[i]) return;
  if(isTF(game.questions[i])) return onAnswerTF(p, d);
  if(isSA(game.questions[i])) return onAnswerSA(p, d);
  const q = game.questions[i], choice = +d.choice;
  if(!(choice >= 0 && choice < q.options.length)) return;
  const el = Math.min(game.qTime, (Date.now() - game.qStart)/1000);
  const ok = choice === q.answer;
  const pts = ok ? Math.round(500 + 500 * Math.max(0, 1 - el / game.qTime)) : 0;
  p.answers[i] = {choice, ok, t: el, pts};
  p.score += pts; p.time += el; if(ok){ p.correct++; p.ctime += el; p.units = (p.units || 0) + weightOf(q); }
  game.counts[choice]++;
  sendTo(p, {t:'ack'});
  refreshHost();
  const on = onlinePlayers();

function onAnswerSA(p, d){
  const i = game.qIndex, q = game.questions[i];

  const pts = ok ? Math.round(500 + 500 * Math.max(0, 1 - el / game.qTime)) : 0;
  p.answers[i] = {choice: val, ok, t: el, pts};
  p.score += pts; p.time += el; if(ok){ p.correct++; p.ctime += el; p.units = (p.units || 0) + weightOf(q); }
  game.saDist = game.saDist || {}; game.saDist[val] = (game.saDist[val] || 0) + 1;
  sendTo(p, {t:'ack'});
  refreshHost();
  const on = onlinePlayers();
  if(on.length && on.every(x => x.answers[i])) setTimeout(() => { if(game.phase === 'question' && game.qIndex === i) endQuestion(); }, 700);
}
function onAnswerTF(p, d){
  const i = game.qIndex, q = game.questions[i];
  const ch = Array.isArray(d.choice) ? d.choice.slice(0, q.options.length).map(v => v === 1 ? 1 : v === 0 ? 0 : -1) : null;

  const k = ch.filter((v, j) => v === q.tf[j]).length, frac = tfFrac(k, q.options.length), ok = k === q.options.length;
  const pts = Math.round(frac * (500 + 500 * Math.max(0, 1 - el / game.qTime)));

  p.score += pts; p.time += el; p.units = (p.units || 0) + frac * weightOf(q); if(ok){ p.correct++; p.ctime += el; }
  ch.forEach((v, j) => { if(v === q.tf[j]) game.counts[j]++; });
  sendTo(p, {t:'ack'});
  refreshHost();
  const on = onlinePlayers();
  if(on.length && on.every(x => x.answers[i])) setTimeout(() => { if(game.phase === 'question' && game.qIndex === i) endQuestion(); }, 700);
}

function fastest(){

    const el = $('#answered'); if(el){ const on = onlinePlayers(); el.textContent = `${on.filter(p => p.answers[game.qIndex]).length}/${on.length} đã trả lời`; }
  }
}

/* --- Câu hỏi --- */
function startQuestion(i){

function hostTick(){

}
function endQuestion(){

      <span class="pill">${playerList().filter(p => p.answers[i] && p.answers[i].ok).length}/${playerList().length} ${isTF(q) ? 'đúng cả 4 ý' : 'trả lời đúng'}</span></div>

    ${isTF(q) ? `<div class="htf">${q.options.map((o,k) => `<div class="r"><span class="k">${TFL[k]})</span><span>${rich(o)}<small>${game.counts[k]}/${playerList().filter(p => p.answers[i]).length} em chọn đúng</small></span><span class="v ${q.tf[k] === 1 ? 'y' : 'n'}">${q.tf[k] === 1 ? 'Đúng' : 'Sai'}</span></div>`).join('')}</div>` : ''}

function sendReveal(p, rm){
  const i = game.qIndex, q = game.questions[i], a = p.answers[i];
  if(isSA(q)) return sendTo(p, {t:'reveal', idx:i, kind:'sa', result: a ? (a.ok ? 'ok' : 'no') : 'none', key: q.sa.split(/[|;]/)[0], mine: a ? a.choice : null, gained: a ? a.pts : 0, score: p.score, rank: rm[p.pid], players: playerList().length});
  if(isTF(q)) return sendTo(p, {t:'reveal', idx:i, kind:'tf4', result: a ? (a.ok ? 'ok' : a.k > 0 ? 'part' : 'no') : 'none', k: a ? a.k : 0, n: q.options.length, key: q.tf, mine: a ? a.choice : null, gained: a ? a.pts : 0, score: p.score, rank: rm[p.pid], players: playerList().length});
  sendTo(p, {t:'reveal', idx:i, result: a ? (a.ok ? 'ok' : 'no') : 'none', answer: LETTERS[q.answer], answerText: q.options[q.answer], gained: a ? a.pts : 0, score: p.score, rank: rm[p.pid], players: playerList().length});
}
/* ===== Chế độ mỗi học sinh một đề ===== */
function assignPaper(p){
  const ex = game.exam; if(!ex || p.paper) return;
  if(ex.k){ const v = ex.assigned++ % ex.k; p.paper = ex.variants[v]; p.code = String(101 + v); }
  else { p.paper = makePaper(); p.code = 'riêng'; ex.assigned++; }
  p.nq = p.paper.length; p.answers = {}; p.submitted = false;
}
function sendPaper(p){
  const pool = game.questions;
  sendTo(p, {t:'exam', code: p.code, total: p.paper.length,
    qs: p.paper.map(x => { const q = pool[x.qi]; return {text: q.text, options: x.perm.map(k => q.options[k]), image: q.image || null, kind: isTF(q) ? 'tf4' : isSA(q) ? 'sa' : 'mc'}; }),
    remain: Math.max(0, Math.round((game.exam.end - Date.now()) / 1000)),
    answers: Object.fromEntries(Object.entries(p.answers).map(([i, a]) => [i, a.choice])), submitted: !!p.submitted});
}
function startExam(){
  const ex = game.exam;
  ex.start = Date.now(); ex.end = ex.start + ex.min * 60000; ex.assigned = 0;
  if(ex.k) ex.variants = Array.from({length: ex.k}, () => makePaper());
  game.phase = 'exam';
  playerList().forEach(p => { p.paper = null; assignPaper(p); sendPaper(p); });
  Sound.start();
  renderExamMonitor();
  clearInterval(game.timer); game.timer = setInterval(examTick, 1000); examTick();
}
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2,'0') + ':' + String(sec % 60).padStart(2,'0'); };
function examTick(){
  const left = (game.exam.end - Date.now()) / 1000, el = $('#exTime');
  if(el){ el.textContent = mmss(left); el.classList.toggle('hurry', left <= 60); }
  if(left <= 0) endExam();
}
function renderExamMonitor(){

    <div class="qbar"><span class="pill">${ex.k ? ex.k + ' mã đề' : 'Mỗi em một đề'} · ${'Phần I: ' + ex.struct.mc + ' · II: ' + ex.struct.tf + ' · III: ' + ex.struct.sa + ' (' + ex.n + ' câu)'}</span><span class="pill" id="exDone"></span><span class="spacer"></span>

function refreshExam(){
  const box = $('#mon'); if(!box) return;
  const ps = playerList();
  box.innerHTML = ps.map(p => { const n = Object.keys(p.answers || {}).length, N = p.nq || game.exam.n;
    return `<div class="mcard ${p.submitted ? 'done' : ''} ${p.online ? '' : 'off'}"><div class="top"><span class="av">${p.avatar}</span><span class="nm">${esc(p.name)}</span><span class="code">${p.code === 'riêng' ? '' : 'Đề ' + esc(p.code || '')}</span></div>
      <div class="mbar"><i style="width:${Math.round(100 * n / N)}%"></i></div>
      <div class="muted" style="font-size:.85rem">${p.submitted ? '✓ Đã nộp bài' : (p.online ? 'Đang làm' : 'Mất kết nối')} · ${n}/${N} câu</div></div>`; }).join('') || '<p class="muted">Chưa có học sinh.</p>';
  const d = $('#exDone'); if(d) d.textContent = `Đã nộp ${ps.filter(p => p.submitted).length}/${ps.length}`;
}
function onExamAnswer(p, d){
  if(game.phase !== 'exam' || !p.paper || p.submitted) return;
  const i = +d.i, x = p.paper[i];
  if(!x) return;
  if(x.sa != null){
    const val = saNorm(d.choice).slice(0, 12);
    if(!val){ delete p.answers[i]; return refreshExam(); }
    p.answers[i] = {choice: val, ok: saMatch(val, x.sa), t: (Date.now() - game.exam.start) / 1000};
    return refreshExam();
  }
  if(x.tf){
    if(!Array.isArray(d.choice)) return;
    const ch = x.tf.map((_, j) => d.choice[j] === 1 ? 1 : d.choice[j] === 0 ? 0 : -1);
    const k = ch.filter((v, j) => v === x.tf[j]).length;
    p.answers[i] = {choice: ch, k, ok: k === x.tf.length, frac: tfFrac(k, x.tf.length), t: (Date.now() - game.exam.start) / 1000};
    return refreshExam();
  }
  const k = +d.choice;
  if(!(k >= 0 && k < game.questions[x.qi].options.length)) return;
  p.answers[i] = {choice: k, ok: k === x.answer, t: (Date.now() - game.exam.start) / 1000};
  refreshExam();
}
function onExamSubmit(p){
  if(game.phase !== 'exam' || !p.paper || p.submitted) return;
  p.submitted = true; p.time = (Date.now() - game.exam.start) / 1000;
  sendTo(p, {t:'submitted'}); Sound.join(); refreshExam();
  const on = onlinePlayers();
  if(on.length && on.every(x => x.submitted)){ toast('Cả lớp đã nộp bài — đang tổng hợp kết quả…'); setTimeout(() => { if(game && game.phase === 'exam') endExam(); }, 2000); }
}
function endExam(){
  if(!game || game.phase !== 'exam') return;
  clearInterval(game.timer);
  const now = (Date.now() - game.exam.start) / 1000;
  playerList().forEach(p => {
    if(!p.paper) return;
    if(!p.submitted) p.time = Math.min(now, game.exam.min * 60);
    const all = Object.values(p.answers), ok = all.filter(a => a.ok);
    p.correct = ok.length; p.ctime = ok.reduce((a, b) => a + b.t, 0);
    p.units = Object.entries(p.answers).reduce((acc, [i, b]) => { const x = p.paper[i]; if(!x) return acc; return acc + weightOf(game.questions[x.qi]) * (b.frac != null ? b.frac : (b.ok ? 1 : 0)); }, 0);
    p.score = Math.round(1000 * p.units / maxPts(p));
  });
  finishGame();
}

const GROUPS = [

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#E4572E','#1F9E89','#E39B0F','#5B4BC4','#13294B'], sym = ['+','−','×','÷','π','√','∞','x²'];
  const ps = Array.from({length:120}, () => ({x: Math.random()*c.width, y: -20 - Math.random()*c.height*.5, vy: 2 + Math.random()*3, vx: -1 + Math.random()*2, r: Math.random()*6, s: sym[Math.floor(Math.random()*sym.length)], col: cols[Math.floor(Math.random()*cols.length)], sz: 16 + Math.random()*16}));
  let t0 = performance.now();
  (function f(t){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .03; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.col; x.font = `800 ${p.sz}px "Be Vietnam Pro",sans-serif`; x.fillText(p.s,0,0); x.restore(); });
    if(t - t0 < 4500) requestAnimationFrame(f); else c.remove();
  })(t0);
}

async function studentConnect(){

  S.connTimeout = setTimeout(() => { if(!S.welcomed && attempt === S.attempt) studentFail('Không vào được phòng sau 25 giây.'); }, 25000);
  if(window.mqtt){
    const r = await studentMqtt(attempt);
    if(attempt !== S.attempt || r === 'ok') return;
    S.diag.push(r === 'noroom' ? 'Kênh trung chuyển: kết nối được nhưng chưa thấy phòng ' + S.code : 'Kênh trung chuyển: không kết nối được máy chủ');
  }

async function studentMqtt(attempt){
  const pref = parseInt(new URLSearchParams(location.search).get('b'), 10);
  const order = BROKERS.map((_,i) => i); if(pref >= 0 && pref < BROKERS.length){ order.splice(order.indexOf(pref), 1); order.unshift(pref); }
  let reached = false;
  for(const i of order){
    let c; try{ c = await mqttConnect(BROKERS[i]); }catch(e){ continue; }
    reached = true;
    if(attempt !== S.attempt){ c.end(true); return 'stale'; }
    const base = mqTopic(S.code), topics = [base + '/host', base + '/all', base + '/down/' + S.pid];
    let hostSeen = false;
    const found = await new Promise(res => {
      const to = setTimeout(() => res(false), 4000);
      c.on('message', (t, buf) => {
        if(t === base + '/host'){ hostSeen = buf.length > 0; if(hostSeen){ clearTimeout(to); res(true); } else if(S.welcomed && !S.closed) toast('Máy giáo viên đang mất mạng, chờ một chút…'); return; }
        if(!S.mq) return;
        let d; try{ d = JSON.parse(buf.toString()); }catch(e){ return; }
        onHostMsg(d);
      });
      c.subscribe(topics, {qos: 1});
    });
    if(!found || attempt !== S.attempt){ c.end(true); continue; }
    S.mq = {client: c, base};
    const conn = S.conn = {via: 'mqtt', open: true, send(msg){ c.publish(base + '/up', JSON.stringify(Object.assign({}, msg, {pid: S.pid})), {qos: 1}); }};
    const join = () => conn.send({t:'join', pid:S.pid, name:S.name, avatar:S.avatar});
    c.on('connect', () => { c.subscribe(topics, {qos: 1}); conn.open = true; join(); });
    c.on('offline', () => { conn.open = false; });
    join();
    clearInterval(S.ping); S.ping = setInterval(() => { if(conn.open) conn.send({t:'ping'}); }, 5000);
    return 'ok';
  }
  return reached ? 'noroom' : 'unreachable';
}
function studentPeer(attempt){
  peer = new Peer(PEER_OPTS);

    const conn = peer.connect(PEER_PREFIX + S.code, {reliable:true});
    S.conn = conn;
    conn.on('open', () => conn.send({t:'join', pid:S.pid, name:S.name, avatar:S.avatar}));
    conn.on('data', onHostMsg);
    conn.on('close', () => { if(S.conn === conn && !S.closed) studentLost(); });
  });
  peer.on('error', e => {
    if(attempt !== S.attempt) return;
    if(e.type === 'peer-unavailable') studentFail('Không tìm thấy phòng ' + S.code + '. Kiểm tra lại mã phòng trên màn hình lớn, hoặc giáo viên chưa mở phòng.');
    else if(!S.welcomed) studentFail('Kênh trực tiếp: lỗi ' + (e.type || 'không rõ') + '.');
  });
  peer.on('disconnected', () => { try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
}
function studentFail(msg){

}

        <div style="margin-top:20px">${d.top.map((p,k) => `<div class="rank"><span class="pos">${k+1}</span><span class="av">${p.avatar}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.d10 != null ? p.d10.toLocaleString('vi-VN') : p.score.toLocaleString('vi-VN')}</span></div>`).join('')}</div>

    <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn" data-act="exprev" ${i === 0 ? 'disabled' : ''}>‹ Câu trước</button><button class="btn" data-act="exnext" ${i === ex.total - 1 ? 'disabled' : ''}>Câu sau ›</button></div>
    <div class="exnav" aria-label="Chuyển nhanh tới câu">${ex.qs.map((_, j) => `<button class="${ex.answers[j] != null ? 'ans' : ''} ${j === i ? 'cur' : ''}" data-act="exgo" data-i="${j}" aria-label="Câu ${j+1}${ex.answers[j] != null ? ', đã làm' : ''}">${j+1}</button>`).join('')}</div>
    <button class="btn primary big" style="width:100%" data-act="exsubmit">Nộp bài (${done}/${ex.total} câu đã làm)</button>`);
  examClock();
}
function examSubmittedView(){
  const ex = S.exam;
  sShell(`<div class="center"><div class="bigicon">📩</div><p class="bigmsg">Em đã nộp bài!</p><p class="muted">Đã làm ${Object.keys(ex.answers).length}/${ex.total} câu${ex.code && ex.code !== 'riêng' ? ' · Mã đề ' + esc(ex.code) : ''}.</p><p>Chờ cô thu bài và công bố kết quả nhé.</p></div>`);
}
function studentChoose(k){
  if(!S.q || S.q.sent || !S.conn || !S.conn.open) return;
  S.q.sent = true; Sound.send();
  app.querySelectorAll('.sans .ans').forEach((b,i) => { b.disabled = true; if(i !== k) b.classList.add('dim'); });
  S.conn.send({t:'ans', idx:S.q.idx, choice:k});
}

/* ============ Khởi động ============ */
const params = new URLSearchParams(location.search);
if(params.has('room')) studentEntry(params.get('room'));
else if(params.has('join')) studentEntry('');
else { app.innerHTML = '<div class="wrap center"><p class="bigmsg">Đang mở bộ câu hỏi…</p></div>'; loadSets().then(v => { sets = v || {}; renderSetup(); }); }
window.addEventListener('pagehide', () => { if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; try{ IDB.set('sets', JSON.parse(JSON.stringify(sets))); }catch(e){} } });
window.addEventListener('beforeunload', e => { if(game && game.phase !== 'lobby' && game.phase !== 'end'){ e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
